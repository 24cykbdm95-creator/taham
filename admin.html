
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAHAM Yönetim Paneli</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f4f7;color:#17243a;font-family:Arial,sans-serif}
header{background:#10233f;color:white;padding:24px 5%}
header h1{margin:0}
main{max-width:1100px;margin:30px auto;padding:0 18px}
.panel{background:white;padding:24px;border-radius:12px;margin-bottom:22px;box-shadow:0 3px 14px #14233a12}
h2{color:#10233f;margin-top:0}
input,textarea{width:100%;padding:12px;border:1px solid #ccd3df;border-radius:7px;margin:7px 0 14px;font:inherit}
textarea{min-height:90px}
button{border:0;border-radius:7px;padding:11px 17px;cursor:pointer;font-weight:bold;background:#bd984c;color:#10233f;margin:3px}
.danger{background:#b83232;color:white}
.secondary{background:#dce3ed}
.hidden{display:none}
.record{border:1px solid #e0e5ec;padding:16px;border-radius:9px;margin:12px 0;overflow-wrap:anywhere}
.muted{color:#68768a;font-size:14px}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:#eef2f7;padding:16px;border-radius:8px;flex:1;min-width:130px}
.stat strong{display:block;font-size:25px;color:#10233f}
</style>
</head>
<body>

<header>
<h1>TAHAM Yönetim Paneli</h1>
<p>Türkiye Adalet ve Hak Arama Merkezi</p>
</header>

<main>
<section class="panel" id="loginPanel">
<h2>Yönetici Girişi</h2>
<p class="muted">Yönetici şifrenizi girin.</p>
<input type="password" id="sifre" placeholder="Yönetici şifresi">
<button onclick="girisYap()">Giriş Yap</button>
<p id="girisMesaj"></p>
</section>

<div id="adminArea" class="hidden">

<section class="panel">
<h2>Genel Bakış</h2>
<div class="stats">
<div class="stat">Toplam kayıt<strong id="toplamKayit">0</strong></div>
<div class="stat">Kategori sayısı<strong id="toplamKategori">0</strong></div>
</div>
<button class="secondary" onclick="cikisYap()">Güvenli Çıkış</button>
</section>

<section class="panel">
<h2 id="formBaslik">Yeni Soru Ekle</h2>
<input id="kategori" placeholder="Kategori">
<textarea id="sorular" placeholder="Örnek sorular (her satıra bir soru)"></textarea>
<textarea id="anahtarlar" placeholder="Anahtar kelimeler (her satıra bir kelime)"></textarea>
<textarea id="cevap" placeholder="Cevap"></textarea>
<input id="link" placeholder="Resmî bağlantı">
<input id="kaynak" placeholder="Kaynak kurum">
<button onclick="kaydet()">Kaydet</button>
<button class="secondary" onclick="formuTemizle()">Temizle</button>
<p id="formMesaj"></p>
</section>

<section class="panel">
<h2>Soru Havuzu</h2>
<input id="arama" placeholder="Kayıtlarda ara..." oninput="listele()">
<div id="kayitlar"></div>
</section>

<section class="panel">
<h2>Toplu Soru Yükleme</h2>
<input type="file" id="jsonDosya" accept=".json,application/json">
<button onclick="topluYukle()">JSON Dosyasını Yükle</button>
</section>

</div>
</main>

<script>
let tumKayitlar = [];
let adminPassword = "";
let duzenlenenId = null;

async function istek(url, method = "GET", veri = null) {
    const ayarlar = {
        method,
        headers: {
            "x-admin-password": adminPassword
        }
    };

    if (veri !== null) {
        ayarlar.headers["Content-Type"] = "application/json";
        ayarlar.body = JSON.stringify(veri);
    }

    const cevap = await fetch(url, ayarlar);

    if (cevap.status === 401) {
        throw new Error("Şifre hatalı veya oturum sona erdi.");
    }

    if (!cevap.ok) {
        throw new Error("İşlem başarısız: " + cevap.status);
    }

    return cevap.json();
}

function mesaj(id, yazi) {
    document.getElementById(id).textContent = yazi;
}

async function girisYap() {
    adminPassword = document.getElementById("sifre").value;

    try {
        await istek("/api/admin/sorular");

        document.getElementById("loginPanel").classList.add("hidden");
        document.getElementById("adminArea").classList.remove("hidden");

        mesaj("girisMesaj", "");
        await listele();
    } catch (hata) {
        adminPassword = "";
        mesaj("girisMesaj", "Giriş başarısız. Şifrenizi kontrol edin.");
    }
}

function cikisYap() {
    adminPassword = "";
    tumKayitlar = [];
    document.getElementById("sifre").value = "";
    document.getElementById("adminArea").classList.add("hidden");
    document.getElementById("loginPanel").classList.remove("hidden");
}

function guvenli(metin) {
    return String(metin || "").replace(/[&<>"']/g, karakter => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[karakter]);
}

async function listele() {
    try {
        tumKayitlar = await istek("/api/admin/sorular");

        const arama = document.getElementById("arama").value.toLocaleLowerCase("tr-TR");

        const filtre = tumKayitlar.filter(k =>
            JSON.stringify(k).toLocaleLowerCase("tr-TR").includes(arama)
        );

        document.getElementById("toplamKayit").textContent = tumKayitlar.length;
        document.getElementById("toplamKategori").textContent =
            new Set(tumKayitlar.map(k => k.kategori).filter(Boolean)).size;

        document.getElementById("kayitlar").innerHTML = filtre.map(k => `
            <div class="record">
                <h3>${guvenli(k.kategori)}</h3>
                <p>${guvenli((k.sorular || []).join(" / "))}</p>
                <p class="muted">${guvenli(k.cevap)}</p>
                <button onclick="duzenle('${guvenli(k.id)}')">Düzenle</button>
                <button class="danger" onclick="sil('${guvenli(k.id)}')">Sil</button>
            </div>
        `).join("") || "<p>Kayıt bulunamadı.</p>";

    } catch (hata) {
        mesaj("formMesaj", hata.message);
    }
}

async function kaydet() {
    const veri = {
        kategori: document.getElementById("kategori").value.trim(),
        sorular: document.getElementById("sorular").value.split("\n").map(x => x.trim()).filter(Boolean),
        anahtarlar: document.getElementById("anahtarlar").value.split("\n").map(x => x.trim()).filter(Boolean),
        cevap: document.getElementById("cevap").value.trim(),
        link: document.getElementById("link").value.trim(),
        kaynak: document.getElementById("kaynak").value.trim()
    };

    if (!veri.kategori || !veri.cevap || veri.sorular.length === 0) {
        mesaj("formMesaj", "Kategori, örnek soru ve cevap zorunludur.");
        return;
    }

    try {
        if (duzenlenenId !== null) {
            await istek("/api/admin/sorular/" + encodeURIComponent(duzenlenenId), "PUT", veri);
        } else {
            await istek("/api/admin/sorular", "POST", veri);
        }

        mesaj("formMesaj", "Kayıt başarıyla kaydedildi.");
        formuTemizle();
        await listele();

    } catch (hata) {
        mesaj("formMesaj", hata.message);
    }
}

function duzenle(id) {
    const kayit = tumKayitlar.find(k => String(k.id) === String(id));
    if (!kayit) return;

    duzenlenenId = kayit.id;

    document.getElementById("formBaslik").textContent = "Soruyu Düzenle";
    document.getElementById("kategori").value = kayit.kategori || "";
    document.getElementById("sorular").value = (kayit.sorular || []).join("\n");
    document.getElementById("anahtarlar").value = (kayit.anahtarlar || []).join("\n");
    document.getElementById("cevap").value = kayit.cevap || "";
    document.getElementById("link").value = kayit.link || "";
    document.getElementById("kaynak").value = kayit.kaynak || "";

    window.scrollTo({top: 0, behavior: "smooth"});
}

async function sil(id) {
    if (!confirm("Bu kaydı silmek istediğinize emin misiniz?")) return;

    try {
        await istek("/api/admin/sorular/" + encodeURIComponent(id), "DELETE");
        await listele();
    } catch (hata) {
        alert(hata.message);
    }
}

function formuTemizle() {
    duzenlenenId = null;
    document.getElementById("formBaslik").textContent = "Yeni Soru Ekle";

    ["kategori", "sorular", "anahtarlar", "cevap", "link", "kaynak"].forEach(id => {
        document.getElementById(id).value = "";
    });
}

async function topluYukle() {
    const dosya = document.getElementById("jsonDosya").files[0];

    if (!dosya) {
        alert("Önce JSON dosyası seçin.");
        return;
    }

    try {
        const veriler = JSON.parse(await dosya.text());

        if (!Array.isArray(veriler)) {
            throw new Error("JSON dosyası soru listesi olmalıdır.");
        }

        for (const kayit of veriler) {
            await istek("/api/admin/sorular", "POST", kayit);
        }

        alert(veriler.length + " kayıt yüklendi.");
        document.getElementById("jsonDosya").value = "";
        await listele();

    } catch (hata) {
        alert("Yükleme başarısız: " + hata.message);
    }
}
</script>
</body>
</html>
